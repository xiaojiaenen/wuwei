name: CI

on:
  push:
    branches: [master, 'codex/**']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache-dependency-glob: pyproject.toml
      - name: Install
        run: |
          uv pip install --python .venv/bin/python -e '.[dev,anthropic,mcp]'
      - name: Fatal lint checks
        run: .venv/bin/ruff check wuwei/ --select E9,F63,F7,F82
      - name: Test (offline; live provider calls require explicit --live)
        run: .venv/bin/python -m pytest tests/ -q
      - name: Documentation
        if: matrix.python-version == '3.12'
        run: |
          uv pip install --python .venv/bin/python -e '.[docs]'
          .venv/bin/python -m mkdocs build --strict
      - name: Distribution
        if: matrix.python-version == '3.12'
        run: uv build
